name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  identity:
    uses: EggIncTools/EggIdentity/.github/workflows/build-identity.yml@main

  build-test:
    needs: identity
    uses: EggIncTools/EggIdentity/.github/workflows/dotnet-ci.yml@main
    permissions:
      contents: read
      packages: read
    with:
      solution: EggIncTools.slnx
      packages-auth: true
      format-gate: true
      build-height: ${{ needs.identity.outputs.height }}
      build-sha: ${{ needs.identity.outputs.sha }}
    secrets:
      PACKAGES_PAT: ${{ secrets.PACKAGES_PAT }}

  image:
    needs: [identity, build-test]
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    uses: EggIncTools/EggIdentity/.github/workflows/docker-publish.yml@main
    permissions:
      contents: read
      packages: write
      actions: write
    with:
      image-suffix: ""
      context: .
      dockerfile: EggIncTools.Web/Dockerfile
      needs-pat: true
      build-args: GITHUB_PACKAGES_USER=${{ github.actor }}
      cache-scope: web
      tags-mode: commit
      build-height: ${{ needs.identity.outputs.height }}
      build-sha: ${{ needs.identity.outputs.sha }}
    secrets:
      PACKAGES_PAT: ${{ secrets.PACKAGES_PAT }}

  notify:
    needs: [identity, image]
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    uses: EggIncTools/EggIdentity/.github/workflows/notify-deploy.yml@main
    with:
      app: egginctools
      hook-url: https://id.egginc.tools
      digest: ${{ needs.image.outputs.digest }}
      revision: ${{ needs.identity.outputs.sha }}
      version: ${{ needs.identity.outputs.version }}
      height: ${{ needs.identity.outputs.height }}
      packages: "[]"
    secrets:
      hook-secret: ${{ secrets.DEPLOY_HOOK_SECRET }}
